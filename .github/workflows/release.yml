name: Release

# 触发：推 tag（如 v0.2.0）或手动。
#
# 刻意**只**在 tag 上发布：每次 push 都发版会让 release 列表被噪音淹没，
# 而且用户无法判断哪个版本"该用"。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.2.0）；手动触发时必填"
        required: true

permissions:
  contents: write # 创建 Release 需要
  packages: write # 推送 GHCR Docker 镜像需要

jobs:
  release:
    name: 交叉编译并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 发布前先跑测试
        # 发布不该建立在未验证的代码上 —— 即便 CI 已经跑过，
        # 也防止 tag 打在了绕过 CI 的提交上。
        run: go test -timeout 300s ./...

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: 交叉编译全部平台
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # 把 tag 注入二进制，否则 `trae2api version` 报的是源码里的默认值，
          # 与 Release 标题对不上（用户会以为下错了包）。
          #
          # ⚠️ -X 只能改 **string 变量**，改不了常量 ——
          # 所以 internal/server.Version 必须是 var（见那里的注释）。
          LDFLAGS="-s -w -X trae2api/internal/server.Version=${VERSION}"
          for target in \
            linux/amd64 linux/arm64 linux/arm \
            windows/amd64 windows/arm64 \
            darwin/amd64 darwin/arm64
          do
            goos="${target%%/*}"; goarch="${target##*/}"
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            out="dist/trae2api-${goos}-${goarch}${ext}"
            echo "构建 $out"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/trae2api
          done
          # 打包（tar.gz / zip），附带 README 与示例配置
          cd dist
          for f in trae2api-*; do
            case "$f" in
              # ⚠️ zip 必须带 -j：它会把 `../README.md` **原样**存成带 `..` 的条目，
              # 而 unzip 默认拒绝解压含 `..` 的路径（防目录穿越），
              # 用户拿到 Windows 包会解压失败。-j 只存文件名，扁平且可解压。
              *.exe) zip -q -j "${f%.exe}.zip" "$f" ../README.md ../docker/config.docker.json ;;
              *)     tar -czf "$f.tar.gz" "$f" -C .. README.md docker/config.docker.json ;;
            esac
          done
          ls -lh
          # 校验和：仅对正式发布的压缩包生成 SHA256SUMS，避免用户本地校验时因缺少未发布的裸二进制而报错
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
          # 自检：压缩包必须非空，且能列出内容 —— 防止"构建成功但包是空的"
          for a in *.tar.gz; do tar -tzf "$a" >/dev/null || { echo "::error::$a 无法读取"; exit 1; }; done
          for a in *.zip;    do unzip -tq "$a"  >/dev/null || { echo "::error::$a 无法读取"; exit 1; }; done
          echo "✅ 全部压缩包可读"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Trae2Api ${{ steps.ver.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          body: |
            ## 安装

            下载对应平台的压缩包，解压后直接运行（零第三方依赖，无需运行时）：

            ```bash
            ./trae2api serve            # 首次运行会生成 config.json
            ```

            默认监听 `127.0.0.1:7870`，控制台在 `http://127.0.0.1:7870/`。

            ## Docker 镜像

            支持直接从 GitHub Container Registry 拉取官方多架构镜像（推荐）：

            ```bash
            docker pull ghcr.io/xcool-603/trae2api:${{ steps.ver.outputs.tag }}
            docker pull ghcr.io/xcool-603/trae2api:latest
            ```

            ## 校验

            ```bash
            sha256sum -c SHA256SUMS
            ```

            > ⚠️ 本项目需要本机已登录 Trae CN / TRAE SOLO CN 客户端来读取凭据；
            > 也可在别处导出便携快照后导入，从而脱离客户端运行。

  docker:
    name: 构建并推送 Docker 镜像 (GHCR)
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - uses: actions/checkout@v4

      - name: 确定版本号与镜像名称
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Docker 镜像仓库名称必须全部小写
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU (多架构支持)
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
